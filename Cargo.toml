[package]
name = "snapshot-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
datafusion = "55.2.0"
futures = "0.3.34"
hex = "0.4.3"
memmap2 = "0.9.12"
object_store = { version = "0.13.2", features = ["aws"] }
opensrv-mysql = { path = "vendor/opensrv-mysql" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"

[dev-dependencies]
mysql = "28.0.4"
sysinfo = "0.40.1"
tempfile = "3.27.0"
